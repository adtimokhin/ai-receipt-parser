[project]
name = "receipt-parser-backend"
version = "0.1.0"
description = "receipt-parser-backend microservice"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.141.1",
    "fastapi-cli==0.0.32",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "pymongo==4.18.0",
    "openai==3.8.0",
    "tenacity==9.1.4",
    "aioboto3==15.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pre-commit==4.3.0",
    "moto[server]==5.2.3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipt_parser_backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["receipt_parser_backend", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra -q"
testpaths = ["tests"]
